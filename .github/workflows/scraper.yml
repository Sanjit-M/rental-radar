name: Scheduled Facebook Rental Scraper

on:
  schedule:
    # Runs 3x daily at 09:00 AM, 03:00 PM, and 09:00 PM IST (03:30, 09:30, 15:30 UTC)
    - cron: '30 3,9,15 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (ubuntu-latest or self-hosted)'
        required: false
        default: 'ubuntu-latest'

jobs:
  scrape-and-sync:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Ensure sqlite3 CLI is installed
        run: |
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y sqlite3
          fi

      - name: Build Go radar-scraper binary
        run: |
          mkdir -p bin data
          go build -o bin/radar-scraper ./cmd/radar-scraper

      - name: Run Rental Scraper & Sync to Turso Cloud
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FB_SESSION_STORAGE: ${{ secrets.FB_SESSION_STORAGE }}
        run: |
          ./bin/radar-scraper sync
          ./bin/radar-scraper run --workers=4 --limit-groups=15 --headless=true
          ./bin/radar-scraper sync
